name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad10_auto_full:dev
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: "0"

      - name: Generate outputs
        working-directory: hardware
        run: kibot -e granit.kicad_sch -b granit.kicad_pcb -d generated

      - name: Generate diffs
        working-directory: hardware
        continue-on-error: true
        run: kibot -e granit.kicad_sch -b granit.kicad_pcb -d generated -s run_erc,run_drc diff_sch diff_pcb

      - name: Package artifacts
        run: |
          cd hardware/generated
          zip -r /tmp/granit-${{ github.ref_name }}.zip .
          zip -r /tmp/granit-jlcpcb-${{ github.ref_name }}.zip JLCPCB/ 2>/dev/null || true
          zip -r /tmp/granit-pcbway-${{ github.ref_name }}.zip PCBWay/ 2>/dev/null || true
          cp Schematic/granit-schematic.pdf /tmp/ 2>/dev/null || true
          cp BoM/granit-bom.html /tmp/ 2>/dev/null || true
          cp Assembly/granit-ibom.html /tmp/ 2>/dev/null || true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            /tmp/granit-${{ github.ref_name }}.zip
            /tmp/granit-jlcpcb-${{ github.ref_name }}.zip
            /tmp/granit-pcbway-${{ github.ref_name }}.zip
            /tmp/granit-schematic.pdf
            /tmp/granit-bom.html
            /tmp/granit-ibom.html
