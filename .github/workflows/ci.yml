name: "Hardware CI"

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "hardware/**"
      - "site/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "hardware/**"
      - "site/**"

permissions:
  contents: write

jobs:
  generate:
    name: Generate & Deploy
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: "0"

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip python3-lxml git rsync wget jq > /dev/null 2>&1
          pip install --break-system-packages --no-compile git+https://github.com/INTI-CMNB/KiBot.git@dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: KiBot
        working-directory: hardware
        run: kibot -e granit.kicad_sch -b granit.kicad_pcb -d generated

      - name: Determine version
        id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Discover assets
        id: assets
        run: |
          GEN=hardware/generated
          RENDERS="[]"
          [ -d "$GEN/3D" ] && RENDERS=$(find "$GEN/3D" -name '*.png' -printf '%f\n' | sort | jq -R . | jq -s .)
          echo "renders=$(echo $RENDERS | jq -c .)" >> "$GITHUB_OUTPUT"

          DL="[]"
          add() {
            local m=$(find "$GEN" -path "$GEN/$2" -type f 2>/dev/null | head -1)
            [ -n "$m" ] && DL=$(echo "$DL" | jq --arg n "$1" --arg p "${m#$GEN/}" '. + [{"name":$n,"path":$p}]')
          }
          add "Schematic (PDF)" "Schematic/*.pdf"
          add "BOM (HTML)" "BoM/*.html"
          add "Interactive BOM" "Assembly/*ibom*.html"
          add "JLCPCB" "JLCPCB/*.zip"
          add "PCBWay" "PCBWay/*.zip"
          echo "downloads=$(echo $DL | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo and Go
        run: |
          wget -q "https://go.dev/dl/go1.23.8.linux-amd64.tar.gz" -O /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C /usr/local
          export PATH="/usr/local/go/bin:$PATH"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v0.147.0/hugo_extended_0.147.0_linux-amd64.tar.gz" -O /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo

      - name: Build Hugo site
        env:
          PATH: "/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="$TAG"
          [ "$TAG" = "latest" ] && VERSION="main"
          rsync -a hardware/generated/ site/static/
          mkdir -p site/static/kicad
          cp hardware/*.kicad_sch hardware/*.kicad_pcb site/static/kicad/
          KICAD_FILES=$(cd site/static/kicad && ls *.kicad_sch *.kicad_pcb 2>/dev/null | jq -R . | jq -s -c .)
          RENDERS='${{ steps.assets.outputs.renders }}'
          DOWNLOADS='${{ steps.assets.outputs.downloads }}'
          printf 'baseURL: https://laenzlinger.github.io/granit/%s/\nparams:\n  version: "%s"\n  kicadFiles: %s\n  renders: %s\n  downloads: %s\n' \
            "$TAG" "$VERSION" "$KICAD_FILES" "$RENDERS" "$DOWNLOADS" > site/config_override.yaml
          cd site
          hugo mod get
          hugo --minify --config hugo.yaml,config_override.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: site-${{ steps.ver.outputs.tag }}
          path: site/public

      - name: Update versions.json
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          EXISTING="[]"
          git show gh-pages:versions.json > /tmp/old.json 2>/dev/null && \
            EXISTING=$(jq 'map(select(.tag != "'"$TAG"'"))' /tmp/old.json)
          NEW=$(jq -n --arg tag "$TAG" '{tag:$tag}')
          echo "$EXISTING" | jq --argjson new "$NEW" \
            '[$new] + [.[] | del(.latest)] | .[0].latest = true' > /tmp/versions.json
          mkdir -p deploy-root
          cp /tmp/versions.json deploy-root/versions.json
          echo '<meta http-equiv="refresh" content="0;url=latest/">' > deploy-root/index.html
          touch deploy-root/.nojekyll

      - name: Deploy root files
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy-root
          clean: false

      - name: Deploy versioned site
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/public
          target-folder: ${{ steps.ver.outputs.tag }}
