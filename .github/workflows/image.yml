name: "Build OS Image"

on:
  push:
    branches: [main]
    paths:
      - "software/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build image
        working-directory: software
        run: make build

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: granit-image
          path: software/pi-gen-upstream/deploy/*
          retention-days: 14
