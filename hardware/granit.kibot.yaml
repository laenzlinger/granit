kibot:
  version: 1

global:
  kicad_dnp_applies_to_3D: true

import:
  - file: JLCPCB
  - file: PCBWay

preflight:
  erc:
    enabled: true
  drc:
    enabled: true
  check_zone_fills: false
  set_text_variables:
    name: GIT_HASH
    command: git rev-parse --short HEAD

outputs:
  - name: basic_boardview
    comment: Board View export
    type: boardview
    dir: Assembly

  - name: generic_bom_html
    comment: Generic Bill of Materials in HTML format
    type: bom
    dir: BoM
    options:
      format: HTML
      columns:
        - Row
        - References
        - Value
        - Footprint
        - Quantity Per PCB
        - field: IPN
          name: InvenTree IPN

  - name: basic_ibom
    comment: Interactive Bill of Materials
    type: ibom
    dir: Assembly

  - name: basic_pdf_sch
    comment: Schematic PDF
    type: pdf_sch_print
    dir: Schematic

  - name: basic_pcb_print
    comment: PCB print
    type: pcb_print
    dir: PCB
    options:
      pages:
        - layers: [F.Cu, F.SilkS, Edge.Cuts]
          sheet: Front copper
        - layers: [In1.Cu, Edge.Cuts]
          sheet: Inner 1 (GND)
        - layers: [In2.Cu, Edge.Cuts]
          sheet: Inner 2 (GND)
        - layers: [B.Cu, B.SilkS, Edge.Cuts]
          sheet: Back copper

  # FIXME: Add 3D renders (blender_export) once ghcr.io/inti-cmnb/kicad10_auto_full image is available
  # See pedalboard-hw for reference: https://github.com/pedalboard/pedalboard-hw

  - name: openpnp_position
    comment: Pick and place position file for OpenPnP
    type: position
    dir: Assembly
    options:
      format: CSV
      separate_files_for_front_and_back: false
      only_smd: true
      dnf_filter: _kibom_dnf

  - name: basic_navigate
    comment: Web page to navigate the outputs
    type: navigate_results
    dir: Browse

  - name: diff_sch
    comment: Schematic diff vs previous tag
    type: diff
    dir: Diff
    run_by_default: false
    options:
      old: KIBOT_TAG-1
      old_type: git
      cache_dir: /tmp/cache
      add_link_id: true
      pcb: false

  - name: diff_pcb
    comment: PCB diff vs previous tag
    type: diff
    dir: Diff
    run_by_default: false
    options:
      old: KIBOT_TAG-1
      old_type: git
      cache_dir: /tmp/cache
      add_link_id: true
      only_pcb: true
