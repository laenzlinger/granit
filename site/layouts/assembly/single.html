{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ $models := .Site.Params.assemblyModels }}
  {{ with $models }}
  {{ range . }}
  <section class="assembly-model">
    <h2>{{ .name }}</h2>
    <iframe
      src="https://3dviewer.net/#model={{ $.Site.BaseURL }}assembly/{{ .file }}{{ with .edgesettings }},edgesettings={{ . }}{{ end }}"
      style="width:100%;height:500px;border:1px solid #ccc;border-radius:4px;">
    </iframe>
  </section>
  {{ end }}
  {{ else }}
  <p>No assembly models available for this version.</p>
  {{ end }}
</article>
{{ end }}
