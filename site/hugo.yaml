baseURL: https://laenzlinger.github.io/granit/latest/
languageCode: en-us
title: Granit

module:
  imports:
    - path: github.com/laenzlinger/hugo-kicad-site

params:
  projectName: "Granit"
  description: "Custom CM4 carrier board — minimal offsite backup appliance"
  repoURL: "https://github.com/laenzlinger/granit"
  license: "CERN-OHL-P-2.0"
  oshwaID: "CH000031"
  version: "main"
  assemblyModels:
    - name: "Slim (2.5\" HDD)"
      file: "assembly-slim.glb"
    - name: "Wide (3.5\" HDD)"
      file: "assembly-wide.glb"
  renders: []
  downloads: []
  kicadFiles: []
  navbar:
    displayTitle: true
    logo:
      dark: images/logo-dark.svg
    width: wide
  page:
    width: wide
  theme:
    default: system
    displayToggle: false
  footer:
    displayCopyright: false
    displayPoweredBy: false

menu:
  main:
    - name: Release
      pageRef: /release/
      weight: 15
    - name: Board
      pageRef: /board/
      weight: 20
    - name: Assembly
      pageRef: /assembly/
      weight: 45
    - name: Software
      pageRef: /software/
      weight: 55
    - name: GitHub
      url: https://github.com/laenzlinger/granit
      params:
        icon: github
      weight: 100
    - name: Theme Toggle
      weight: 110
      params:
        type: theme-toggle

markup:
  goldmark:
    renderer:
      unsafe: true
